<title>Hearts Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" crossorigin>
<style>
/* A committed card-table look: black and red in every theme */
:root{
  color-scheme:dark;
  --bg:#121012; --surface:#1c181b; --surface-2:#272126; --ink:#f4eeee; --muted:#b3a5aa; --line:#3a3036;
  --accent:#e23a4e; --accent-ink:#ffffff; --gold:#e8b949; --good:#6fd1a0;
  --lead:#2d1a1f; --warn:#ffb25b; --warn-bg:#3a2513; --err:#ff8a8a; --err-bg:#3b1c1f;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:38px;height:38px;flex:none}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
button,select{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px 14px;font-weight:600}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px;padding:14px}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:14px}
.danger{color:var(--err);border-color:var(--err);background:transparent}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=text],select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.r{color:var(--accent)}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}

/* standings */
.players{display:flex;flex-direction:column;gap:8px}
.pl{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:4px 12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.pl.lead{background:var(--lead);border-color:var(--accent)}
.rank{font-weight:800;color:var(--muted);text-align:center;font-size:18px}
.pl.lead .rank{color:var(--accent)}
.pn{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.score{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:800;text-align:right;line-height:1;grid-row:1 / 3;grid-column:3}
.gap{font-size:13px;font-weight:700;color:var(--muted);grid-column:2}
.pl.lead .gap{color:var(--accent)}
.meter{grid-column:1 / 4;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;background:var(--accent)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn);margin-left:6px;vertical-align:1px}

/* passing banner */
.pass{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;padding:16px;border-radius:14px;background:var(--accent);color:var(--accent-ink)}
.pass.hold{background:var(--surface-2);color:var(--ink)}
.pass .arrow{grid-row:1 / 3;font-size:40px;line-height:1;font-weight:800}
.pass .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px}
.pass .meta{font-size:14px;opacity:.9}

/* entry */
.erow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .who{font-weight:700;overflow-wrap:anywhere}
.erow .auto{font-size:12px;font-weight:700;color:var(--gold);margin-left:6px}
.erow input{width:84px;text-align:center;font-size:20px;font-weight:700}
.erow input.autofilled{border:2px dashed var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:9px 14px;border-radius:999px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sumline{font-size:14px;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.sumline.ok{background:var(--lead);color:var(--good)}
.sumline.bad{background:var(--err-bg);color:var(--err)}
.err{background:var(--err-bg);color:var(--err);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
.moonbox{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;border:1px dashed var(--gold)}
.moonbox .t{font-weight:800;color:var(--gold)}

/* history */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
th:first-child,td:first-child{text-align:left}
td.hd button{padding:4px 10px;font-size:14px}
tfoot td{font-weight:800;border-bottom:0}

<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const KEY = "hearts-scorekeeper-v1";
const LIMIT = 100, DANGER = 25;
const PASS = [{d:"left",a:"←"},{d:"right",a:"→"},{d:"across",a:"↑"},{d:null,a:"✋"}];
const LOGO = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0b090b" stroke="#3a3036" stroke-width="3"/><path transform="translate(20 22) scale(.6)" d="M50 92 C 20 66, 4 50, 4 30 C 4 14, 16 4, 30 4 C 40 4, 47 10, 50 18 C 53 10, 60 4, 70 4 C 84 4, 96 14, 96 30 C 96 50, 80 66, 50 92 Z" fill="#e23a4e"/></svg>`;

let state = load() || { phase:"setup", names:["","","",""], firstDealer:0, players:[], dealer0:0, hands:[] };
let entry = null;
let confirmKey = null, confirmTimer = null;

function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pname = i => (state.names[i]||"").trim() || `Player ${i+1}`;
const N = i => esc(state.players[i]);

function totalsAfter(k){ const t = [0,0,0,0]; state.hands.slice(0,k).forEach(h => h.pts.forEach((v,i)=> t[i]+=v)); return t; }
const over = t => t.some(v => v >= LIMIT);
const dealerOf = h => (state.dealer0 + h) % 4;

function confirmThen(key, fn){
  if (confirmKey === key){ clearTimeout(confirmTimer); confirmKey = null; fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(()=>{ confirmKey = null; render(); }, 3500);
}
let wakeLock = null;
async function keepAwake(){
  try{ if (state.phase === "play" && "wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){
    wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }}catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);

function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement && document.activeElement.id;
  app.innerHTML = state.phase === "setup" ? setupView() : playView();
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus({preventScroll:true}); }
}
function header(extra=""){ return `<div class="brand"><div class="logo">${LOGO}<h1>Hearts</h1></div><div class="hx-hbtns">${hx.button()}${extra}</div></div>`; }

function setupView(){
  const opts = [0,1,2,3].map(i=>`<option value="${i}" ${i===state.firstDealer?"selected":""}>${esc(pname(i))}</option>`).join("");
  return header() + `
  <div class="panel">
    <div class="eyebrow">Four players, in seating order going left</div>
    ${[0,1,2,3].map(i=>`<input type="text" id="name-${i}" data-name="${i}" placeholder="Player ${i+1}" value="${esc(state.names[i]||"")}" maxlength="16" autocomplete="off" aria-label="Player ${i+1}">`).join("")}
    <label class="lbl" for="first-dealer">First dealer</label>
    <select id="first-dealer">${opts}</select>
    <button class="primary" data-act="start" id="start">Start game</button>
  </div>
  <p class="hint">Hearts are 1 point each and the Queen of Spades is 13. Shoot the moon and everyone else takes 26. When anyone reaches 100, the lowest score wins.</p>`;
}

function playView(){
  const n = state.hands.length, t = totalsAfter(n), done = over(t), has = n > 0;
  const low = Math.min(...t);
  const order = [0,1,2,3].sort((a,b)=> t[a]-t[b] || a-b);
  const rank = i => 1 + t.filter(v => v < t[i]).length;

  let top = "";
  if (done){
    const winners = order.filter(i => t[i] === low);
    top = `<div class="banner"><div class="eyebrow" style="color:inherit;opacity:.85">Game over · ${n} hands</div>
      <h2>${winners.length>1?`Tie game: ${winners.map(N).join(" &amp; ")}`:`${N(winners[0])} wins`} with ${low}</h2>
      <div class="num">${order.filter(i=>t[i]!==low).map(i=>`${N(i)} ${t[i]}`).join(" · ")}</div>
      <div style="opacity:.9">This game is saved in History.</div>
      <div class="btnrow"><button data-act="rematch" id="rematch">Rematch</button><button data-act="newsetup" id="newsetup2">New players</button></div></div>`;
  }

  const players = order.map(i => {
    const lead = has && t[i] === low;
    let gap = "";
    if (has){
      if (lead){ const others = t.filter(v=>v!==low); gap = t.filter(v=>v===low).length>1 ? "Tied for the lead" : `Leads by ${Math.min(...others) - low}`; }
      else {
        const ahead = t.filter(v => v < t[i]), nearest = Math.max(...ahead);
        gap = `${t[i]-low} behind the lead`;
        if (nearest !== low){ const who = order.find(j=>t[j]===nearest); gap += ` · ${t[i]-nearest} behind ${N(who)}`; }
      }
    }
    const danger = !done && LIMIT - t[i] <= DANGER && t[i] < LIMIT ? `<span class="tag num">${LIMIT - t[i]} from 100</span>` : "";
    return `<div class="pl ${lead?"lead":""}">
      <span class="rank num">${has?rank(i):"–"}</span>
      <span class="pn">${N(i)}${danger}</span>
      <span class="score num">${t[i]}</span>
      ${gap?`<span class="gap num">${gap}</span>`:""}
      <div class="meter" aria-hidden="true"><span style="width:${Math.min(100,t[i])}%"></span></div>
    </div>`;
  }).join("");

  let handBlock = "";
  const hIdx = entry && entry.editing != null ? entry.editing : n;
  if (!done || entry){
    const p = PASS[hIdx % 4];
    handBlock = `<div class="pass ${p.d?"":"hold"}"><span class="arrow" aria-hidden="true">${p.a}</span>
      <span class="big">${p.d?`Pass 3 cards ${p.d.toUpperCase()}`:"No passing this hand"}</span>
      <span class="meta">Hand ${hIdx+1} · ${N(dealerOf(hIdx))} deals · 2♣ leads</span></div>`;
    handBlock += entry ? entryView(hIdx) : `<button class="primary" data-act="newHand" id="newHand">Score hand ${n+1}</button>`;
  }

  let history = "";
  if (has){
    const run = [0,0,0,0];
    const body = state.hands.map((h,hi) => {
      h.pts.forEach((v,i)=> run[i]+=v);
      return `<tr><td class="hd"><button id="edit-${hi}" data-act="edit" data-i="${hi}" aria-label="Edit hand ${hi+1}">${hi+1}</button></td>${h.pts.map((v,i)=>`<td>${h.moon===i?`<span class="moon">🌙 0</span>`:v}${h.queen===i&&h.moon==null?`<span class="q">Q♠</span>`:""}</td>`).join("")}</tr>`;
    }).join("");
    history = `<div class="panel">
      <div class="row"><h2 class="grow">Hands</h2><button class="small" data-act="undo" id="undo">${confirmKey==="undo"?"Tap to confirm":"Undo last"}</button></div>
      <div class="tablewrap"><table><thead><tr><th>Hand</th>${[0,1,2,3].map(i=>`<th>${N(i)}</th>`).join("")}</tr></thead>
      <tbody>${body}</tbody><tfoot><tr><td>Total</td>${t.map(v=>`<td>${v}</td>`).join("")}</tr></tfoot></table></div>
      <div class="legend"><span><span class="q">Q♠</span> took the Queen</span><span><span class="moon">🌙</span> shot the moon</span><span>Tap a hand number to fix it</span></div>
    </div>` + statsView();
  }

  const reset = `<button class="small ghost" data-act="newgame" id="newgame">${confirmKey==="new"?"Tap to confirm":"New game"}</button>`;
  return header(reset) + top + `<div class="players">${players}</div>` + handBlock + history +
    `<details class="rules"><summary>Rules</summary><ul class="rulelist">
      <li>Each heart is 1 point. The Queen of Spades is 13. Every hand adds up to 26.</li>
      <li>Shoot the moon (every heart and the Queen) and everyone else takes 26.</li>
      <li>Passing goes left, right, across, then no pass, and repeats.</li>
      <li>When anyone reaches 100, the lowest score wins. A tie for lowest is a tie game.</li></ul></details>
    <p class="hint">Every game is saved in History on this device. Tap History to see past games. The screen stays on while you play.</p>`;
}

function statsView(){
  const H = state.hands, n = H.length;
  const queens = [0,0,0,0], moons = [0,0,0,0], clean = [0,0,0,0], won = [0,0,0,0];
  let worst = {v:-1, list:[]};
  H.forEach((h,hi) => {
    if (h.moon != null) moons[h.moon]++; else if (h.queen != null) queens[h.queen]++;
    const m = Math.min(...h.pts);
    h.pts.forEach((v,i) => {
      if (v === 0 && h.moon !== i) clean[i]++;
      if (v === m) won[i]++;
      if (h.moon == null){ if (v > worst.v) worst = {v, list:[[i,hi]]}; else if (v === worst.v) worst.list.push([i,hi]); }
    });
  });
  const top = arr => { const m = Math.max(...arr); return { m, who: arr.map((v,i)=>i).filter(i=>arr[i]===m) }; };
  const names = idx => idx.map(N).join(", ");
  const q = top(queens), mo = top(moons), c = top(clean);
  const t = totalsAfter(n);
  const hl = [
    `<div class="aw"><span class="an">Queen magnet</span><span class="ah">${q.m?names(q.who):"Nobody yet"}</span><span class="ad">${q.m?`Took the Queen ${q.m} time${q.m>1?"s":""}`:"The Queen is still loose"}</span></div>`,
    `<div class="aw"><span class="an">Moonwalker</span><span class="ah">${mo.m?names(mo.who):"Nobody yet"}</span><span class="ad">${mo.m?`Shot the moon ${mo.m} time${mo.m>1?"s":""}`:"No moons shot"}</span></div>`,
    `<div class="aw"><span class="an">Clean hands</span><span class="ah">${c.m?names(c.who):"Nobody yet"}</span><span class="ad">${c.m?`${c.m} hand${c.m>1?"s":""} with 0 points`:"Everyone's taken something"}</span></div>`,
    `<div class="aw"><span class="an">Ouch</span><span class="ah">${worst.v>0?names([...new Set(worst.list.map(x=>x[0]))]):"Nobody yet"}</span><span class="ad">${worst.v>0?`${worst.v} points in hand ${worst.list.map(x=>x[1]+1).join(", ")}`:""}</span></div>`,
  ].join("");
  const rows = [0,1,2,3].map(i=>`<tr><td>${N(i)}</td><td>${queens[i]}</td><td>${moons[i]}</td><td>${clean[i]}</td><td>${won[i]}</td><td>${(t[i]/n).toFixed(1)}</td></tr>`).join("");
  return `<div class="panel">
    <h2>Stats</h2>
    <div class="hl">${hl}</div>
    <div class="tablewrap"><table><thead><tr><th>Player</th><th>Q♠</th><th>Moons</th><th>Clean</th><th>Low hand</th><th>Avg</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint">Low hand counts hands where a player had the fewest points, ties included.</p>
  </div>`;
}

function entryView(hIdx){
  let body;
  if (entry.moon != null){
    body = `<div class="moonbox"><span class="t">🌙 ${N(entry.moon)} shot the moon</span>
      <span class="hint">${N(entry.moon)} takes 0. Everyone else takes 26.</span>
      <div class="chips">${[0,1,2,3].map(i=>`<button class="chip" id="moon-${i}" data-act="moonWho" data-i="${i}" aria-pressed="${entry.moon===i}">${N(i)}</button>`).join("")}</div>
      <button class="small" data-act="noMoon" id="noMoon">Nobody shot the moon</button></div>`;
  } else {
    const rows = [0,1,2,3].map(i => `<div class="erow"><label class="who" for="pts-${i}">${N(i)}${entry.auto===i?`<span class="auto">auto</span>`:""}</label>
      <input type="text" inputmode="numeric" id="pts-${i}" data-pts="${i}" class="${entry.auto===i?"autofilled":""}" value="${esc(entry.raw[i])}" placeholder="–" autocomplete="off"></div>`).join("");
    body = `<div>${rows}</div>
      <div><div class="eyebrow" style="margin-bottom:8px">Who took the Queen of Spades?</div>
      <div class="chips">${[0,1,2,3].map(i=>`<button class="chip" id="queen-${i}" data-act="queen" data-i="${i}" aria-pressed="${entry.queen===i}">${N(i)}</button>`).join("")}</div></div>
      ${sumLine()}
      <button class="small" data-act="moon" id="moonBtn">🌙 Someone shot the moon</button>`;
  }
  return `<div class="panel">
    <div class="row"><h2 class="grow">${entry.editing!=null?"Edit hand":"Hand"} ${hIdx+1}</h2><button class="small ghost" data-act="cancel" id="cancel">Cancel</button></div>
    ${entry.moon==null?`<p class="hint">Type each player's points. After three, the last fills in so the hand adds to 26.</p>`:""}
    ${body}
    ${entry.error?`<div class="err">${esc(entry.error)}</div>`:""}
    <button class="primary" data-act="saveHand" id="saveHand">${entry.editing!=null?"Save changes":"Post hand "+(hIdx+1)}</button>
    ${entry.editing!=null?`<button class="danger" data-act="delHand" id="delHand">${confirmKey==="del"?"Tap again to delete hand "+(hIdx+1):"Delete this hand"}</button>`:""}
  </div>`;
}
function sumLine(){
  const vals = entry.raw.map(v => /^\d+$/.test(String(v).trim()) ? +v : null);
  const got = vals.filter(v=>v!=null).length, s = vals.reduce((a,v)=>a+(v||0),0);
  const cls = got === 4 ? (s === 26 ? "ok" : "bad") : "";
  const msg = got === 4 ? (s === 26 ? "26 of 26 points" : `${s} of 26 points. A hand adds up to 26.`) : `${s} of 26 points so far`;
  return `<div class="sumline ${cls} num" id="sumline">${msg}</div>`;
}
function autofill(){
  const set = entry.set;
  const unset = [0,1,2,3].filter(i => !set[i]);
  if (entry.auto != null){ const el = document.getElementById("pts-"+entry.auto); entry.raw[entry.auto] = ""; if (el){ el.value = ""; el.classList.remove("autofilled"); } entry.auto = null; }
  if (unset.length === 1){
    const i = unset[0];
    const s = [0,1,2,3].filter(j=>j!==i).reduce((a,j)=>a+(+entry.raw[j]||0),0);
    if (s <= 26){
      entry.raw[i] = String(26 - s); entry.auto = i;
      const el = document.getElementById("pts-"+i); if (el){ el.value = entry.raw[i]; el.classList.add("autofilled"); }
    }
  }
  const lbls = document.querySelectorAll(".erow .auto"); lbls.forEach(l=>l.remove());
  if (entry.auto != null){ const lab = document.querySelector(`label[for="pts-${entry.auto}"]`); if (lab) lab.insertAdjacentHTML("beforeend", `<span class="auto">auto</span>`); }
  const sl = document.getElementById("sumline"); if (sl) sl.outerHTML = sumLine();
}

function openEntry(editIdx){
  if (editIdx != null){
    const h = state.hands[editIdx];
    entry = { editing:editIdx, raw:h.pts.map(String), set:[true,true,true,true], auto:null, queen:h.queen, moon:h.moon, error:"" };
  } else entry = { editing:null, raw:["","","",""], set:[false,false,false,false], auto:null, queen:null, moon:null, error:"" };
  render();
  const f = document.getElementById("pts-0"); if (f){ f.focus(); f.scrollIntoView({block:"center"}); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, i = b.dataset.i != null ? +b.dataset.i : null;
  switch(act){
    case "start": state.players = [0,1,2,3].map(pname); state.dealer0 = state.firstDealer; state.hands = []; state.phase = "play"; entry = null; save(); render(); keepAwake(); break;
    case "newHand": openEntry(null); break;
    case "edit": openEntry(+b.dataset.i); break;
    case "cancel": entry = null; render(); break;
    case "queen": entry.queen = i; entry.error = ""; render(); break;
    case "moon": entry.moon = entry.moon ?? 0; entry.error = ""; render(); break;
    case "moonWho": entry.moon = i; render(); break;
    case "noMoon": entry.moon = null; render(); break;
    case "saveHand": {
      let hand;
      if (entry.moon != null){
        hand = { pts:[0,1,2,3].map(j => j===entry.moon ? 0 : 26), queen:entry.moon, moon:entry.moon };
      } else {
        const bad = entry.raw.findIndex(v => !/^\d+$/.test(String(v).trim()));
        if (bad >= 0){ entry.error = `Enter points for ${state.players[bad]} (0 if none).`; render(); break; }
        const pts = entry.raw.map(v=>parseInt(v,10)), s = pts.reduce((a,v)=>a+v,0);
        if (s !== 26){ entry.error = `Points add up to ${s}. A hand has 26: 13 hearts plus the Queen.`; render(); break; }
        if (entry.queen == null){ entry.error = "Tap who took the Queen of Spades."; render(); break; }
        if (pts[entry.queen] < 13){ entry.error = `${state.players[entry.queen]} took the Queen, so they need at least 13 points. Check the numbers.`; render(); break; }
        if (pts[entry.queen] === 26){ entry.error = `${state.players[entry.queen]} took all 26. That's shooting the moon, so tap the moon button instead.`; render(); break; }
        hand = { pts, queen:entry.queen, moon:null };
      }
      if (entry.editing != null) state.hands[entry.editing] = hand; else state.hands.push(hand);
      entry = null; save(); render(); window.scrollTo({top:0, behavior:"smooth"}); break;
    }
    case "delHand": confirmThen("del", ()=>{ state.hands.splice(entry.editing,1); entry = null; save(); render(); }); break;
    case "undo": confirmThen("undo", ()=>{ state.hands.pop(); entry = null; save(); render(); }); break;
    case "rematch": state.hands = []; state.dealer0 = (state.dealer0 + 1) % 4; entry = null; save(); render(); break;
    case "newsetup": state.phase = "setup"; state.hands = []; entry = null; save(); render(); break;
    case "newgame": confirmThen("new", ()=>{ state.phase = "setup"; state.hands = []; entry = null; save(); render(); }); break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.name != null){
    state.names[+t.dataset.name] = t.value; save();

  if (t.dataset.pts != null && entry){
    const i = +t.dataset.pts, clean = t.value.replace(/\D/g,"");
    if (clean !== t.value) t.value = clean;
    entry.raw[i] = clean; entry.set[i] = clean !== ""; entry.error = "";
    if (entry.auto === i){ entry.auto = null; t.classList.remove("autofilled"); }
    if (entry.editing == null) autofill(); else { const sl = document.getElementById("sumline"); if (sl) sl.outerHTML = sumLine(); }

});
document.addEventListener("change", e => { if (e.target.id === "first-dealer"){ state.firstDealer = +e.target.value; save(); } });
document.addEventListener("keydown", e => {

/* hx:js:start */
// History adapter: how a Hearts game looks to the shared history module.
// A round is one hand. h.pts already holds the app's scored points (a moon is stored as 0 for the shooter and
// 26 for everyone else), and the app's totals are the plain sum of them, so no totals override is needed.
const HX = {
  app: "hearts", title: "Hearts", unit: ["hand", "hands"], sideWord: "player", lowWins: true,
  guest: n => /^player \d+$/i.test(String(n).trim()),
  current(){
    if (state.phase !== "play" || !Array.isArray(state.hands) || !state.hands.length) return null;
    const H = state.hands, P = [0,1,2,3], t = totalsAfter(H.length), done = over(t), low = Math.min(...t);
    const name = i => String((state.players || [])[i] || pname(i));
    return {
      sides: P.map(i => ({ name: name(i), players: [name(i)] })),
      rounds: H.map(h => P.map(i => h.pts[i])),
      done, winners: done ? P.filter(i => t[i] === low) : undefined,
      labels: H.map((h,i) => h.moon != null ? `${i+1} · 🌙` : String(i+1)),
      extra: { moon: H.map(h => h.moon != null ? h.moon : null), queen: H.map(h => h.queen != null ? h.queen : null) }
    };
  },
  // Queens are counted like the app's own stats and hands table: a moon hand's Queen isn't counted.
  queens(x, i){ return x.queen.filter((q,k) => q === i && x.moon[k] == null).length; },
  detail(g){
    const x = g.extra; if (!x || !Array.isArray(x.moon) || !Array.isArray(x.queen)) return "";
    const nm = i => esc(g.sides[i] ? g.sides[i].name : `Player ${i+1}`);
    const moons = x.moon.map((m,k) => m != null ? `Hand ${k+1}: ${nm(m)} shot the moon` : "").filter(Boolean);
    const queens = g.sides.map((_,i) => [i, HX.queens(x, i)]).filter(q => q[1]).map(([i,n]) => `${nm(i)} ${n === 1 ? "once" : n + " times"}`);
    return `<p class="hint">${moons.length ? moons.join(" · ") : "Nobody shot the moon."}</p>` + (queens.length ? `<p class="hint">Took the Queen: ${queens.join(" · ")}</p>` : "");
  },
  records(done){
    const out = [], rows = [], moons = new Map();
    done.forEach(g => {
      const x = g.extra; if (!x || !Array.isArray(x.moon) || !Array.isArray(x.queen)) return;
      g.sides.forEach((s,i) => {
        rows.push({ g, who: s.name, q: HX.queens(x, i) });
        const m = x.moon.filter(v => v === i).length, nm = String(s.name).trim();
        if (!m || HX.guest(nm)) return;
        const k = nm.replace(/\s+/g, " ").toLowerCase(), r = moons.get(k) || { name: nm, n: 0 };
        r.n += m; moons.set(k, r);
      });
    });
    const names = w => [...new Set(w)].slice(0,3).join(", ");
    const when = w => w.length === 1 ? new Date(w[0].g.date).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }) : `${w.length} times`;
    if (moons.size){
      const all = [...moons.values()], m = Math.max(...all.map(r => r.n));
      out.push(["Most moons shot", names(all.filter(r => r.n === m).map(r => r.name)), `${m} moon${m === 1 ? "" : "s"}`]);
    }
    const q = rows.length ? Math.max(...rows.map(r => r.q)) : 0;
    if (q){ const w = rows.filter(r => r.q === q); out.push(["Most Queens in a game", names(w.map(r => r.who)), `${q} · ${when(w)}`]); }
    return out;
  }
};
/* ---------- game history (shared module, same in every score app) ----------
   Every game with at least one scored round is saved to localStorage as it's played, with its date,
   the teams or players, every round's scores, the final totals and the winner. A "History" screen shows
   all-time records by player name, a game log with full scorecards, and backup / restore.
   The app supplies an adapter, HX (defined just above), and this module wraps the app's save() and render(). */
const hx = (() => {
  const HKEY = HX.app + "-history-v1", BKEY = HX.app + "-last-backup";
  const unitOne = (HX.unit || ["round", "rounds"])[0], unitMany = (HX.unit || ["round", "rounds"])[1];
  const ui = { open: false, range: "all", sel: null, game: null, all: false, msg: "", confirm: null, timer: 0 };
  const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-US");
  const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
  const pkey = n => String(n || "").trim().replace(/\s+/g, " ").toLowerCase();
  const guest = n => !pkey(n) || (HX.guest ? HX.guest(n) : /^(player|partner|team|side|seat) \d+$/i.test(String(n).trim()));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const whenTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const dayTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };

  // ----- storage -----
  const valid = g => !!g && typeof g.id === "string" && Array.isArray(g.sides) && g.sides.length >= 1 && g.sides.every(s => s && typeof s.name === "string" && Array.isArray(s.players))
    && Array.isArray(g.rounds) && g.rounds.every(r => Array.isArray(r) && r.length === g.sides.length && r.every(v => typeof v === "number" && isFinite(v)));
  function load() { try { const a = JSON.parse(localStorage.getItem(HKEY) || "[]"); return Array.isArray(a) ? a.filter(valid) : []; } catch (err) { return []; } }
  let games = load();
  function persist() { try { localStorage.setItem(HKEY, JSON.stringify(games)); } catch (err) { /* storage full or blocked */ } }
  const totalsOf = g => Array.isArray(g.totals) && g.totals.length === g.sides.length ? g.totals : g.sides.map((_, i) => g.rounds.reduce((s, r) => s + r[i], 0));
  function winnersOf(g) {
    if (Array.isArray(g.winners) && g.winners.length) return g.winners;
    const t = totalsOf(g), best = g.lowWins ? Math.min(...t) : Math.max(...t);
    return t.map((_, i) => i).filter(i => t[i] === best);
  }
  const isDone = g => !!g.done;

  // ----- keep the archive in step with the current game -----
  // A game is saved as soon as its first round is scored. Starting a new game (or undoing back to nothing)
  // detaches it; a game undone to nothing after one round is dropped, anything longer stays as unfinished.
  function sync() {
    if (typeof state !== "object" || !state) return;
    let cur = null;
    try { cur = HX.current(); } catch (err) { cur = null; }
    const has = cur && Array.isArray(cur.rounds) && cur.rounds.length > 0;
    const k = state.hxId ? games.findIndex(g => g.id === state.hxId) : -1;
    if (has) {
      if (!state.hxId) state.hxId = newId();
      const prev = k >= 0 ? games[k] : null;
      const g = {
        id: state.hxId, date: prev ? prev.date : new Date().toISOString(), updated: new Date().toISOString(),
        sides: cur.sides.map(s => ({ name: String(s.name || ""), players: (s.players || []).map(String) })),
        rounds: cur.rounds.map(r => r.map(v => +v || 0)),
        totals: (cur.totals || null) && cur.totals.map(v => +v || 0),
        done: !!cur.done, winners: cur.done && Array.isArray(cur.winners) ? cur.winners.slice() : undefined,
        lowWins: !!(cur.lowWins != null ? cur.lowWins : HX.lowWins), note: cur.note || "", labels: cur.labels || undefined, extra: cur.extra || undefined
      };
      if (!g.totals) delete g.totals;
      const before = prev ? JSON.stringify(Object.assign({}, prev, { updated: 0 })) : "";
      if (before === JSON.stringify(Object.assign({}, g, { updated: 0 }))) return;
      if (k >= 0) games[k] = g; else games.push(g);
      persist();
    } else if (state.hxId) {
      // games with no game-over of their own end when the app says so (New game): the best total wins
      let ended = false;
      try { ended = typeof HX.ended === "function" && !!HX.ended(); } catch (err) { ended = false; }
      if (k >= 0 && !games[k].done && ended) {
        const g = games[k], t = g.totals || g.sides.map((_, i) => g.rounds.reduce((a, r) => a + (+r[i] || 0), 0));
        const best = g.lowWins ? Math.min(...t) : Math.max(...t);
        g.done = true; g.winners = t.map((_, i) => i).filter(i => t[i] === best); g.updated = new Date().toISOString();
        persist();
      } else if (k >= 0 && !games[k].done && games[k].rounds.length <= 1) { games.splice(k, 1); persist(); }
      state.hxId = null;
    }
  }

  // ----- stats -----
  const byDate = () => games.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  function inRange(g) {
    if (ui.range === "all") return true;
    const d = new Date(g.date);
    if (isNaN(d)) return false;
    if (ui.range[0] === "y") return d.getFullYear() === +ui.range.slice(1);
    return Date.now() - d <= +ui.range.slice(1) * 864e5;
  }
  const rangeLabel = () => ui.range === "all" ? "all time" : ui.range[0] === "y" ? ui.range.slice(1) : `the last ${ui.range.slice(1)} days`;
  function sideLabel(s) {
    const named = s.players.filter(p => !guest(p));
    if (s.players.length > 1) return guest(s.name) || !s.name ? (named.length ? s.players.join(" & ") : s.name || "Team") : `${s.name} (${s.players.join(" & ")})`;
    return s.players[0] || s.name;
  }
  function shortLabel(s) {
    if (s.players.length > 1) return guest(s.name) || !s.name ? s.players.join(" & ") : s.name;
    return s.players[0] || s.name;
  }
  function career(list) {
    const map = new Map(), pairs = new Map();
    list.filter(isDone).forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => {
        const won = w.includes(i);
        s.players.forEach(name => {
          if (guest(name)) return;
          const k = pkey(name);
          let p = map.get(k);
          if (!p) { p = { k, name: "", gp: 0, wins: 0, shared: 0, sum: 0, best: null, worst: null, streak: 0, bestStreak: 0 }; map.set(k, p); }
          p.name = String(name).trim();
          p.gp++; p.sum += t[i];
          const better = (a, b) => g.lowWins ? a < b : a > b;
          if (p.best == null || better(t[i], p.best)) p.best = t[i];
          if (p.worst == null || better(p.worst, t[i])) p.worst = t[i];
          if (won) { p.wins++; if (w.length > 1) p.shared++; p.streak++; p.bestStreak = Math.max(p.bestStreak, p.streak); } else p.streak = 0;
        });
        const named = s.players.filter(n => !guest(n));
        if (s.players.length === 2 && named.length === 2) {
          const pk = named.map(pkey).sort().join("|");
          const r = pairs.get(pk) || { names: named.map(n => String(n).trim()).sort((a, b) => a.localeCompare(b)), gp: 0, wins: 0 };
          r.gp++; if (won) r.wins++;
          pairs.set(pk, r);
        }
      });
    });
    const players = [...map.values()].sort((a, b) => b.wins - a.wins || b.wins / b.gp - a.wins / a.gp || a.name.localeCompare(b.name));
    const teams = [...pairs.values()].sort((a, b) => b.wins - a.wins || b.gp - a.gp || a.names.join().localeCompare(b.names.join()));
    return { players, teams };
  }
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
  const avg = (a, b) => b ? num(Math.round(a / b)) : "–";

  // ----- views -----
  function button() { return `<button class="small ghost" data-hx="open" id="hx-open" type="button">History</button>`; }
  function note() { return `<p class="hint">Saved in History with today's date.</p>`; }
  function unbacked() { let at = 0; try { at = +localStorage.getItem(BKEY) || 0; } catch (err) { /* ignore */ } return games.filter(isDone).length - at; }
  function award(t, w, d) { return `<div class="hx-award"><span class="hx-an">${t}</span><span class="hx-aw">${w}</span><span class="hx-ad">${d}</span></div>`; }

  function recordsView(done, stats) {
    if (!done.length) return "";
    const items = [];
    const scores = [], margins = [];
    done.forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => scores.push({ v: t[i], who: sideLabel(s), g }));
      if (w.length === 1 && g.sides.length > 1) {
        const others = t.filter((_, i) => i !== w[0]);
        const runner = g.lowWins ? Math.min(...others) : Math.max(...others);
        margins.push({ v: Math.abs(t[w[0]] - runner), who: sideLabel(g.sides[w[0]]), g });
      }
    });
    const pick = (list, hi) => { const m = hi ? Math.max(...list.map(x => x.v)) : Math.min(...list.map(x => x.v)); return { m, who: list.filter(x => x.v === m) }; };
    const names = who => e([...new Set(who.map(x => x.who))].slice(0, 3).join(", ")) + (new Set(who.map(x => x.who)).size > 3 ? "…" : "");
    const when = who => who.length === 1 ? dayTxt(who[0].g.date) : `${who.length} times`;
    const lowWins = done.every(g => g.lowWins);
    const best = pick(scores, !lowWins), worst = pick(scores, lowWins);
    items.push(award(lowWins ? "Lowest score" : "Highest score", names(best.who), `${num(best.m)} · ${when(best.who)}`));
    items.push(award(lowWins ? "Highest score" : "Lowest score", names(worst.who), `${num(worst.m)} · ${when(worst.who)}`));
    if (margins.length) { const mg = pick(margins, true); items.push(award("Biggest win", names(mg.who), `By ${num(mg.m)} · ${when(mg.who)}`)); }
    const most = f => stats.players.length ? Math.max(...stats.players.map(p => p[f])) : 0;
    const whoOf = (m, f) => e(stats.players.filter(p => p[f] === m).map(p => p.name).slice(0, 3).join(", "));
    const mw = most("wins"), ms = most("bestStreak"), mg2 = most("gp");
    if (stats.players.length) {
      items.push(award("Most wins", mw ? whoOf(mw, "wins") : "–", plural(mw, "win")));
      items.push(award("Longest win streak", ms ? whoOf(ms, "bestStreak") : "–", `${ms} in a row`));
      items.push(award("Most games", whoOf(mg2, "gp"), plural(mg2, "game")));
    }
    if (HX.records) { try { (HX.records(done) || []).forEach(r => items.push(award(e(r[0]), e(r[1]), e(r[2])))); } catch (err) { /* adapter records are optional */ } }
    return `<div class="panel"><h2>Records</h2><div class="hx-awards">${items.join("")}</div></div>`;
  }

  function scorecard(g) {
    const t = totalsOf(g), w = winnersOf(g), run = g.sides.map(() => 0);
    const head = `<tr><th>${e(unitOne[0].toUpperCase() + unitOne.slice(1))}</th>${g.sides.map((s, i) => `<th class="${g.done && w.includes(i) ? "hx-won" : ""}">${e(shortLabel(s))}</th>`).join("")}</tr>`;
    const body = g.rounds.map((r, ri) => {
      r.forEach((v, i) => { run[i] += v; });
      const label = g.labels && g.labels[ri] ? g.labels[ri] : String(ri + 1);
      return `<tr><td>${e(label)}</td>${r.map((v, i) => `<td>${num(v)}${g.rounds.length > 1 ? `<span class="hx-run">${num(run[i])}</span>` : ""}</td>`).join("")}</tr>`;
    }).join("");
    const foot = `<tr class="hx-tot"><td>Total</td>${t.map((v, i) => `<td class="${g.done && w.includes(i) ? "hx-won" : ""}">${num(v)}</td>`).join("")}</tr>`;
    let more = "";
    if (HX.detail) { try { more = HX.detail(g) || ""; } catch (err) { more = ""; } }
    return `<div class="hx-card"><div class="stwrap hx-wrap"><table class="st hx-sc"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>${g.rounds.length > 1 ? `<p class="hint">Small numbers are running totals.</p>` : ""}${more}</div>`;
  }

  function logView(list, sel) {
    let rows = list.slice().reverse();
    if (sel) rows = rows.filter(g => g.sides.some(s => s.players.some(n => pkey(n) === sel.k)));
    if (!rows.length) return "";
    const shown = ui.all ? rows : rows.slice(0, 10);
    const items = shown.map(g => {
      const t = totalsOf(g), w = winnersOf(g);
      const order = t.map((_, i) => i).sort((a, b) => (g.lowWins ? t[a] - t[b] : t[b] - t[a]) || a - b);
      const current = g.id === state.hxId;
      const lead = w.map(i => e(sideLabel(g.sides[i]))).join(" &amp; ");
      let status;
      if (g.done) {
        const others = t.filter((_, i) => !w.includes(i));
        const runner = others.length ? (g.lowWins ? Math.min(...others) : Math.max(...others)) : null;
        status = w.length > 1 ? `${lead} tied` : `${lead} won${runner != null ? ` by ${num(Math.abs(t[w[0]] - runner))}` : ""}`;
      } else status = `<span class="hx-tag">${current ? "In progress" : "Unfinished"}</span> after ${plural(g.rounds.length, unitOne, unitMany)}`;
      const open = ui.game === g.id, del = "del-" + g.id;
      return `<div class="hx-game">
        <div class="hx-meta"><b>${e(whenTxt(g.date))}</b><span class="hint">${status}${g.note ? ` · ${e(g.note)}` : ""}</span></div>
        <div class="hx-scores num">${order.map(i => `<span class="${g.done && w.includes(i) ? "hx-win" : ""}">${e(sideLabel(g.sides[i]))} <b>${num(t[i])}</b></span>`).join(" · ")}</div>
        <div class="btnrow hx-btns"><button class="small" type="button" data-hx="game" data-id="${e(g.id)}" id="hx-g-${e(g.id)}">${open ? "Hide scorecard" : "Scorecard"}</button>${current ? "" : `<button class="small danger" type="button" data-hx="del" data-id="${e(g.id)}" id="hx-d-${e(g.id)}">${ui.confirm === del ? "Tap to delete" : "Delete"}</button>`}</div>
        ${open ? scorecard(g) : ""}
      </div>`;
    }).join("");
    return `<div class="panel"><h2>${sel ? `${e(sel.name)}'s games` : "Game log"}</h2><div class="hx-log">${items}</div>
      ${rows.length > 10 ? `<button class="small" type="button" data-hx="all" id="hx-all">${ui.all ? "Show fewer" : `Show all ${rows.length} games`}</button>` : ""}</div>`;
  }

  function backupView() {
    return `<div class="panel"><h2>Backup &amp; share</h2>
      <p class="hint">History is stored on this phone only. Clearing site data or switching phones loses it, so back it up now and then.</p>
      <p class="hint">To combine two phones' history, share the backup to the other phone and tap Restore there. Games it already has are skipped.</p>
      <div class="btnrow"><button type="button" data-hx="share" id="hx-share" ${games.length ? "" : "disabled"}>Share backup</button><button type="button" data-hx="download" id="hx-download" ${games.length ? "" : "disabled"}>Download</button><button type="button" data-hx="restore" id="hx-restore">Restore</button></div>
      <input type="file" id="hx-file" accept=".json,application/json" hidden>
      ${ui.msg ? `<p class="hint" role="status">${e(ui.msg)}</p>` : ""}</div>`;
  }

  function view() {
    const back = `<button class="small ghost" type="button" data-hx="back" id="hx-back">Back</button>`;
    const top = `<div class="hx-top"><div><div class="eyebrow">${e(HX.title)}</div><h1>History</h1></div>${back}</div>`;
    if (!games.length) return `<div class="hx">${top}<div class="panel"><h2>No games yet</h2><p class="hint">Every game is saved here as you play, with the date, the ${HX.sideWord || "team"}s and every ${unitOne}'s score.</p></div>${backupView()}</div>`;
    const list = byDate().filter(inRange), stats = career(list), done = list.filter(isDone);
    const sel = ui.sel && stats.players.find(p => p.k === ui.sel);
    const years = [...new Set(games.map(g => new Date(g.date).getFullYear()).filter(y => !isNaN(y)))].sort((a, b) => b - a);
    const opt = (v, l) => `<option value="${v}" ${ui.range === v ? "selected" : ""}>${l}</option>`;
    const range = `<div class="row"><label class="eyebrow" for="hx-range">Showing</label><select id="hx-range" class="grow">${opt("all", "All time")}${opt("d30", "Last 30 days")}${opt("d90", "Last 90 days")}${years.map(y => opt("y" + y, y)).join("")}</select></div>`;
    const nudge = unbacked() >= 5 ? `<div class="hx-nudge"><span class="grow">${plural(unbacked(), "finished game")} since your last backup.</span><button class="small" type="button" data-hx="download" id="hx-nudge">Back up now</button></div>` : "";
    let body;
    if (sel) {
      body = `<div class="panel"><div class="row"><h2 class="grow">${e(sel.name)}</h2><button class="small" type="button" data-hx="player" data-k="" id="hx-everyone">Everyone</button></div>

          ${pl.map(p => `<tr><td><button class="hx-link" type="button" data-hx="player" data-k="${e(p.k)}">${e(p.name)}</button></td><td>${p.gp}</td><td>${p.wins}</td><td>${pct(p.wins, p.gp)}</td><td>${avg(p.sum, p.gp)}</td><td>${p.best == null ? "–" : num(p.best)}</td></tr>`).join("")}
        </tbody></table></div><p class="hint">GP: games played. Wins include ties. Avg and Best are ${HX.sideWord === "player" ? "the player's" : "the team's"} final score.</p>`

        ${tm.length ? `<div class="panel"><h2>Partnerships</h2><div class="stwrap"><table class="st"><thead><tr><th>Pair</th><th>GP</th><th>Wins</th><th>Win %</th></tr></thead><tbody>${tm.map(r => `<tr><td>${e(r.names.join(" & "))}</td><td>${r.gp}</td><td>${r.wins}</td><td>${pct(r.wins, r.gp)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}

  }

  // ----- backup -----
  function file() {
    const data = JSON.stringify({ app: HX.app, version: 1, exported: new Date().toISOString(), games }, null, 2);

    ui.msg = `Added ${plural(added, "game")}.` + (updated ? ` Updated ${updated}.` : "") + (skipped ? ` ${skipped} already here.` : "") + (bad ? ` ${bad} unreadable.` : "");
  }

  // ----- events -----
  function confirmThen(key, fn) {

    else if (a === "del") confirmThen("del-" + b.dataset.id, () => { games = games.filter(g => g.id !== b.dataset.id); persist(); render(); });
    else if (a === "all") { ui.all = !ui.all; render(); }
    else if (a === "player") { ui.sel = b.dataset.k || null; ui.all = false; render(); window.scrollTo(0, 0); }
    else if (a === "download") { download(); render(); }
    else if (a === "share") share().then(render);
    else if (a === "restore") { const f = document.getElementById("hx-file"); if (f) f.click(); }
  });
  document.addEventListener("change", ev => {
    if (ev.target.id === "hx-range") { ui.range = ev.target.value; ui.sel = null; render(); }
    if (ev.target.id === "hx-file" && ev.target.files && ev.target.files[0]) ev.target.files[0].text().then(restore, () => { ui.msg = "Couldn't read that file."; }).then(render);
  });

  return { sync, view, button, note, isOpen: () => ui.open, games: () => games };
})();
// Wrap the app's own save() and render(): every save keeps the archive current, and History takes over the screen while open.
{

hx.sync(); save();

render();
keepAwake();
